<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Đăng ký tài khoản Green Shop." />
    <title>Đăng ký · Green Shop</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23A8863A' stroke-width='1.6'%3E%3Cpath d='M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z'/%3E%3Cpath d='M2 21c0-3 1.85-5.36 5.08-6'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script type="module" src="/src/pages/auth.js"></script>
  </head>
  <body data-page="register">
    <header id="site-header"></header>

    <main class="container-x py-14">
      <div class="mx-auto grid max-w-5xl overflow-hidden rounded-3xl bg-ivory shadow-card lg:grid-cols-2">
        <!-- Form -->
        <div class="order-2 p-8 sm:p-12 lg:order-1">
          <p class="eyebrow">Tài khoản mới</p>
          <h1 class="mt-3 font-display text-4xl font-semibold text-forest-800">Đăng ký</h1>
          <p class="mt-2 text-muted">Tham gia cộng đồng yêu cây của Green Shop.</p>

          <form id="register-form" class="mt-8 space-y-5" novalidate>
            <div class="form-group">
              <label class="field-label" for="fullname">Họ và tên</label>
              <input class="field" id="fullname" name="fullname" rules="required|min:2" type="text" placeholder="Nguyễn Văn A" />
              <span class="form-message"></span>
            </div>
            <div class="form-group">
              <label class="field-label" for="email">Email</label>
              <input class="field" id="email" name="email" rules="required|email" type="email" placeholder="ban@email.com" />
              <span class="form-message"></span>
            </div>
            <div class="form-group">
              <label class="field-label" for="password">Mật khẩu</label>
              <input class="field" id="password" name="password" rules="required|min:6" type="password" placeholder="Tối thiểu 6 ký tự" />
              <span class="form-message"></span>
            </div>
            <div class="form-group">
              <label class="field-label" for="confirm">Xác nhận mật khẩu</label>
              <input class="field" id="confirm" name="confirm" rules="required|min:6" type="password" placeholder="Nhập lại mật khẩu" />
              <span class="form-message"></span>
            </div>
            <label class="flex cursor-pointer items-start gap-2 text-sm text-muted">
              <input type="checkbox" class="mt-1 accent-forest-700" /> Tôi đồng ý với <a href="#" class="font-medium text-forest-700">Điều khoản dịch vụ</a> của Green Shop.
            </label>
            <button type="submit" class="btn btn-primary w-full">Tạo tài khoản</button>
          </form>

          <p class="mt-6 text-center text-sm text-muted">Đã có tài khoản?
            <a href="login.html" class="font-semibold text-forest-700 hover:text-gold-600">Đăng nhập</a>
          </p>
        </div>

        <!-- Visual -->
        <div class="relative order-1 hidden lg:order-2 lg:block">
          <img src="assets/img/banner.png" alt="" class="h-full w-full object-cover" />
          <div class="absolute inset-0 bg-gradient-to-t from-forest-900/80 via-forest-900/20 to-transparent"></div>
          <div class="absolute bottom-0 p-10 text-cream">
            <h2 class="font-display text-4xl font-semibold leading-tight">Bắt đầu<br />hành trình xanh</h2>
            <p class="mt-3 max-w-xs text-cream/80">Nhận ưu đãi 15% cho đơn hàng đầu tiên khi đăng ký hôm nay.</p>
          </div>
        </div>
      </div>
    </main>

    <footer id="site-footer"></footer>
    <div id="toast"></div>
  </body>
</html>
