<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Khám phá bộ sưu tập cây cảnh trang trí cao cấp tại Green Shop." />
    <title>Sản phẩm · Green Shop</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23A8863A' stroke-width='1.6'%3E%3Cpath d='M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z'/%3E%3Cpath d='M2 21c0-3 1.85-5.36 5.08-6'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script type="module" src="/src/pages/products.js"></script>
  </head>
  <body data-page="products">
    <header id="site-header"></header>

    <main>
      <!-- Page header -->
      <section class="border-b border-forest-100 bg-sage-50">
        <div class="container-x py-12 text-center">
          <nav class="mb-3 text-sm text-muted">
            <a href="index.html" class="hover:text-forest-700">Trang chủ</a> / <span class="text-forest-700">Sản phẩm</span>
          </nav>
          <h1 class="font-display text-4xl font-semibold text-forest-800 sm:text-5xl">Bộ sưu tập cây cảnh</h1>
          <p class="mx-auto mt-3 max-w-xl text-muted">Tuyển chọn những giống cây đẹp nhất cho không gian sống và làm việc của bạn.</p>
        </div>
      </section>

      <section class="container-x py-12">
        <div class="grid gap-10 lg:grid-cols-[280px,1fr]">
          <!-- Sidebar -->
          <aside class="space-y-8">
            <div class="rounded-2xl bg-ivory p-6 shadow-soft">
              <div class="mb-4 flex items-center justify-between">
                <h2 class="font-display text-xl font-semibold text-forest-800">Danh mục</h2>
                <button id="filter-reset" class="text-xs font-semibold text-gold-600 hover:text-gold-700">Đặt lại</button>
              </div>
              <ul id="category-list" class="space-y-1"></ul>
            </div>

            <div class="rounded-2xl bg-ivory p-6 shadow-soft">
              <h2 class="mb-4 font-display text-xl font-semibold text-forest-800">Mức giá</h2>
              <div class="flex flex-wrap gap-2">
                <button class="price-pill" data-gte="0" data-lte="150">Dưới 150K</button>
                <button class="price-pill" data-gte="150" data-lte="300">150K - 300K</button>
                <button class="price-pill" data-gte="300" data-lte="450">300K - 450K</button>
                <button class="price-pill" data-gte="450" data-lte="">Trên 450K</button>
              </div>
            </div>

            <div class="rounded-2xl bg-ivory p-6 shadow-soft">
              <h2 class="mb-4 font-display text-xl font-semibold text-forest-800">Màu sắc</h2>
              <div class="flex flex-wrap gap-3">
                <button class="swatch" style="background:#4C7A5B" data-color="green" aria-label="Xanh lá"></button>
                <button class="swatch" style="background:#D2603A" data-color="red-orange" aria-label="Cam đỏ"></button>
                <button class="swatch" style="background:#8A6BB0" data-color="violet" aria-label="Tím"></button>
                <button class="swatch" style="background:#3F73B3" data-color="blue" aria-label="Xanh dương"></button>
                <button class="swatch" style="background:#D8B24A" data-color="yellow" aria-label="Vàng"></button>
                <button class="swatch" style="background:#D58AA8" data-color="pink" aria-label="Hồng"></button>
              </div>
            </div>

            <div class="overflow-hidden rounded-2xl bg-forest-800 p-6 text-cream">
              <p class="text-sm uppercase tracking-wider text-gold-400">Ưu đãi</p>
              <p class="mt-2 font-display text-2xl font-semibold">Giảm 15% cho đơn đầu tiên</p>
              <a href="register.html" class="btn btn-gold mt-4 w-full">Đăng ký ngay</a>
            </div>
          </aside>

          <!-- Results -->
          <div>
            <div class="mb-6 flex flex-wrap items-center justify-between gap-4">
              <div>
                <h2 id="results-heading" class="font-display text-2xl font-semibold text-forest-800">Tất cả sản phẩm</h2>
                <p class="text-sm text-muted"><span id="results-count">…</span> sản phẩm</p>
              </div>
              <div class="flex items-center gap-1 rounded-xl bg-ivory p-1 shadow-soft">
                <button class="layout-btn is-active" data-layout="grid" aria-label="Dạng lưới"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></button>
                <button class="layout-btn" data-layout="list" aria-label="Dạng danh sách"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
              </div>
            </div>

            <div id="product-results" class="grid grid-cols-1 gap-6 sm:grid-cols-2 xl:grid-cols-3"></div>

            <div id="pagination" class="mt-12 flex flex-wrap items-center justify-center gap-2"></div>
          </div>
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>
    <div id="toast"></div>
  </body>
</html>
